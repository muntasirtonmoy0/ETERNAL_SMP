<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eternal SMP | Server Gallery & Memories</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <button class="menu-btn" id="menuToggle" aria-label="Toggle Menu"><i class="fa-solid fa-bars"></i></button>
      <a href="index.html" class="logo-link">
        <img src="logo.png" alt="Eternal SMP Logo" class="nav-logo-img">
        <div class="logo"><span class="logo-accent">ETERNAL</span>SMP</div>
      </a>
    </div>
    <div class="ip-widget" onclick="copyIP('play-eternal-smp.duckdns.org:5479')">
      <span class="status-dot" id="headerDot"></span>
      <span id="ipText">Click To Copy IP</span>
      <i class="fa-regular fa-copy"></i>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Navigation</h3>
      <button class="close-btn" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="shop.html" class="nav-link"><i class="fa-solid fa-cart-shopping"></i> Store</a></li>
      <li><a href="leaderboard.html" class="nav-link"><i class="fa-solid fa-trophy"></i> Leaderboard</a></li>
      <li><a href="gallery.html" class="nav-link active"><i class="fa-solid fa-images"></i> Gallery</a></li>
      <li><a href="events.html" class="nav-link"><i class="fa-solid fa-calendar-days"></i> Events</a></li>
      <li><a href="staff.html" class="nav-link"><i class="fa-solid fa-shield-halved"></i> Staff Team</a></li>
      <li><a href="about.html" class="nav-link"><i class="fa-solid fa-circle-info"></i> About Us</a></li>
    </ul>
  </nav>

  <main class="content-container">
    <div class="page-header">
      <h2>Server Memories & Builds</h2>
      <p>A showcase of our community moments, custom builds, PvP arenas, and SMP spawn.</p>
    </div>

    <!-- Filter Buttons -->
    <div class="shop-tabs">
      <button class="shop-tab active" onclick="filterGallery('all', this)">All Shots</button>
      <button class="shop-tab" onclick="filterGallery('spawn', this)">Spawn Village</button>
      <button class="shop-tab" onclick="filterGallery('arena', this)">PvP Arena</button>
      <button class="shop-tab" onclick="filterGallery('community', this)">Community</button>
    </div>

    <!-- Gallery Grid Dynamically Rendered -->
    <div class="gallery-grid" id="galleryContainer"></div>
  </main>

  <!-- Fullscreen Lightbox Modal -->
  <div class="lightbox-overlay" id="lightboxModal" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
      <img src="" alt="Zoomed Screenshot" id="lightboxImage">
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <div class="toast" id="toast">Copied IP to clipboard!</div>
  <script src="app.js"></script>

  <script>
    let allGalleryItems = [];

    async function initGallery() {
      try {
        const res = await fetch('gallery-data.json');
        if (!res.ok) throw new Error('Could not fetch JSON');
        allGalleryItems = await res.json();
      } catch (err) {
        console.warn('Falling back to local cache array');
        allGalleryItems = [
          {
            id: "begin",
            category: "community",
            title: "Server Genesis: Founding Squad",
            description: "Eternal SMP Official Launch & Founding Squad",
            icon: "fa-users",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541781/ETERNAL_SMP_BEGIN.png"
          },
          {
            id: "spawn-1",
            category: "spawn",
            title: "Custom Spawn Citadel",
            description: "Spawn Citadel — Night Sky View",
            icon: "fa-moon",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541814/ETERNAL_SMP_SPAWN1.png"
          },
          {
            id: "spawn-2",
            category: "spawn",
            title: "Ring of Flame (Evening)",
            description: "Spawn Ring of Flame — Sunset Atmosphere",
            icon: "fa-fire",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541811/ETERNAL_SMP_SPAWN2.png"
          },
          {
            id: "spawn-3",
            category: "spawn",
            title: "Town Square & Portals",
            description: "Spawn Town Square & Gatehouse",
            icon: "fa-archway",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541822/ETERNAL_SMP_SPAWN3.png"
          },
          {
            id: "spawn-4",
            category: "spawn",
            title: "Spawn Sanctuary (Top-Down)",
            description: "Spawn Sanctuary — Top-Down Aerial View",
            icon: "fa-ring",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541823/ETERNAL_SMP_SPAWN4.png"
          },
          {
            id: "arena-1",
            category: "arena",
            title: "Cosmic Duel Arena",
            description: "The Singularity — Orbital Combat Sphere",
            icon: "fa-meteor",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541782/ETERNAL_SMP_ARENA1.png"
          },
          {
            id: "arena-2",
            category: "arena",
            title: "Duel Ring Combat Floor",
            description: "Purpur Duel Ring — Ranked Combat Stage",
            icon: "fa-crosshairs",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541834/ETERNAL_SMP_ARENA2.png"
          },
          {
            id: "arena-3",
            category: "arena",
            title: "Ceiling Geometry",
            description: "Colosseum Geometry — Celestial Ceiling Pattern",
            icon: "fa-compass-drafting",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541819/ETERNAL_SMP_ARENA3.png"
          },
          {
            id: "arena-4",
            category: "arena",
            title: "Cosmic Amethyst Dome",
            description: "Cosmic Dome — Amethyst PvP Colosseum",
            icon: "fa-shield-halved",
            url: "https://res.cloudinary.com/retvp8pw/image/upload/v1787541824/ETERNAL_SMP_ARENA4.png"
          }
        ];
      }
      renderGallery('all');
    }

    function renderGallery(category) {
      const container = document.getElementById('galleryContainer');
      const filtered = category === 'all' 
        ? allGalleryItems 
        : allGalleryItems.filter(item => item.category === category);

      container.innerHTML = filtered.map(item => `
        <div class="gallery-item" data-category="${item.category}" onclick="openLightbox('${item.url}', '${item.description}')">
          <img src="${item.url}" alt="${item.title}" loading="lazy">
          <div class="gallery-label">
            <span><i class="fa-solid ${item.icon}"></i> ${item.title}</span>
          </div>
        </div>
      `).join('');
    }

    function filterGallery(category, btn) {
      document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderGallery(category);
    }

    function openLightbox(imgSrc, captionText) {
      document.getElementById('lightboxImage').src = imgSrc;
      document.getElementById('lightboxCaption').textContent = captionText;
      document.getElementById('lightboxModal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
    }

    initGallery();
  </script>
</body>
</html>
