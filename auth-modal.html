<!-- Account Header Widget -->
<div id="authWidget" class="auth-box">
  <div id="loggedOutView">
    <button class="btn btn-secondary" onclick="openAuthModal('login')"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    <button class="btn btn-primary" onclick="openAuthModal('register')"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
  </div>
  <div id="loggedInView" style="display: none;">
    <div class="user-pill">
      <span id="userIgnDisplay"><i class="fa-solid fa-user"></i> Loading...</span>
      <span class="wallet-badge"><i class="fa-solid fa-coins text-gold"></i> <b id="userBalanceDisplay">0</b> Coins</span>
      <button class="logout-btn" onclick="logoutAccount()"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </div>
</div>

<!-- Modal Dialog -->
<div class="modal-backdrop" id="authModal">
  <div class="modal auth-card">
    <div class="modal-header">
      <h3 id="authModalTitle">Sign In</h3>
      <button class="modal-close" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group" id="ignGroup" style="display: none;">
          <label>Minecraft Username (IGN) *</label>
          <input type="text" id="authIgn" minlength="3" maxlength="16" placeholder="Steve">
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="authEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="authPassword" minlength="6" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary full-width" id="authSubmitBtn">Continue</button>
      </form>

      <div style="display:flex;align-items:center;margin:15px 0;color:var(--text-muted);font-size:0.8rem;">
        <hr style="flex:1;border:0;border-top:1px solid var(--border);">
        <span style="padding:0 10px;">OR</span>
        <hr style="flex:1;border:0;border-top:1px solid var(--border);">
      </div>

      <!-- Google Sign In Button -->
      <button type="button" class="btn btn-secondary full-width" onclick="handleGoogleSignIn()" style="display:flex;justify-content:center;gap:10px;">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>

      <p class="auth-switch-text" id="authSwitchText">
        Don't have an account? <a href="#" onclick="toggleAuthMode()">Sign up here</a>
      </p>
    </div>
  </div>
</div>
